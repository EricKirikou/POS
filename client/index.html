<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#1c3928" />
    <meta name="description" content="TradeCore point-of-sale operations dashboard." />
    <link rel="icon" type="image/svg+xml" href="/tradecore-logo.svg" />
    <title>TradeCore | POS Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const analyticsEndpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const analyticsWebsiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      const isPlaceholder = (value) => !value || value === "%VITE_ANALYTICS_ENDPOINT%" || value === "%VITE_ANALYTICS_WEBSITE_ID%";

      if (!isPlaceholder(analyticsEndpoint) && !isPlaceholder(analyticsWebsiteId)) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${analyticsEndpoint.replace(/\/$/, "")}/umami`;
        script.dataset.websiteId = analyticsWebsiteId;
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
